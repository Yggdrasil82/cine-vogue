name: Ciné Vogue

# Rien ne se lance à chaque commit, pour économiser les minutes :
#  - tag captures-*  -> captures d'écran, publiées sur la branche « captures »
#  - tag v*          -> APK signé, publié dans « Releases »
on:
  push:
    tags: ["captures-*", "v*"]
  workflow_dispatch:
    inputs:
      mode:
        description: "captures ou apk"
        type: choice
        options: [captures, apk]
        default: captures

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CAPTURES: ${{ startsWith(github.ref, 'refs/tags/captures-') || inputs.mode == 'captures' }}
      APK: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.mode == 'apk' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Polices
        run: bash scripts/fonts.sh

      - name: Captures d'écran
        if: env.CAPTURES == 'true'
        run: gradle :app:recordPaparazziDebug --no-daemon --stacktrace

      - name: Publier les captures
        if: env.CAPTURES == 'true'
        run: |
          mkdir out
          cp app/src/test/snapshots/images/*.png out/
          cd out
          git init -q -b captures
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add .
          git commit -q -m "Captures ${GITHUB_REF_NAME}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" captures

      - name: APK
        if: env.APK == 'true'
        run: |
          gradle :app:assembleRelease --no-daemon --stacktrace
          V=$(grep versionName app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          cp app/build/outputs/apk/release/app-release.apk "cine-vogue-$V.apk"

      - name: Publier l'APK
        if: env.APK == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Ciné Vogue ${{ github.ref_name }}
          files: cine-vogue-*.apk

      - name: APK (lancement manuel)
        if: env.APK == 'true' && !startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: cine-vogue-apk
          path: cine-vogue-*.apk
